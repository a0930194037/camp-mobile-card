<!doctype html>
<meta charset="utf-8">
<title>Camp Sync v7 checks</title>
<pre id="result">Running…</pre>
<script>globalThis.CAMP_SYNC_CONFIG={url:'https://example.invalid',publishableKey:'test'};</script>
<script src="../sync-engine.js?v=53"></script>
<script>
(async () => {
  const output = document.querySelector('#result');
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const storage = () => ({ value: null, async get() { return this.value; }, async set(_key, value) { this.value = structuredClone(value); } });
  const base = checked => ({ trips: [{ id: 'trip', syncId: 'trip', items: [{ gearId: 'gear', syncId: 'row', checked }] }] });
  const create = async () => {
    const sync = new CampSync(storage(), `test-${crypto.randomUUID()}`);
    await sync.load();
    sync.record.session = { access_token: 'test', expires_at: 9999999999 };
    return sync;
  };
  try {
    const accepted = await create();
    accepted.record.snapshot = base(false);
    let visible = base(true);
    accepted.queue(visible);
    const sent = structuredClone(accepted.record.pending);
    accepted.exchange = async () => ({ status: 'ok', cursor: 1, seed: base(false), mutations: sent.map((operation, index) => ({ ...operation, revision: index + 1, serverSeq: index + 1 })) });
    await accepted.sync(() => visible, next => { visible = next; });
    assert(visible.trips[0].items[0].checked === true, 'accepted checkbox was reverted');
    assert(accepted.record.pending.length === 0, 'accepted mutation was retried');

    const stale = await create();
    stale.record.snapshot = base(true);
    visible = base(false);
    stale.queue(visible);
    stale.exchange = async () => ({ status: 'conflict', cursor: 1, seed: base(false), mutations: [{ operationId: 'server-newer', deviceId: 'other', fieldKey: 'row:trips:trip:items:row/checked', baseRevision: 0, revision: 1, serverSeq: 1, target: 'row:trips:trip:items:row', path: ['checked'], value: true, deleted: false }] });
    await stale.sync(() => visible, next => { visible = next; });
    assert(visible.trips[0].items[0].checked === true, 'stale mutation overwrote the server value');
    assert(stale.record.pending.length === 0, 'stale mutation was queued for retry');

    const independent = await create();
    independent.record.seed = { trips: [{ id: 'trip', syncId: 'trip', items: [{ gearId: 'a', syncId: 'a', checked: false }, { gearId: 'b', syncId: 'b', checked: false }] }] };
    const merged = independent.materialize([
      { operationId: 'a', serverSeq: 1, target: 'row:trips:trip:items:a', path: ['checked'], value: true, deleted: false },
      { operationId: 'b', serverSeq: 2, target: 'row:trips:trip:items:b', path: ['checked'], value: true, deleted: false }
    ]);
    assert(merged.trips[0].items.every(item => item.checked), 'independent rows conflicted');
    output.textContent = 'PASS: v7 authoritative revision checks';
  } catch (error) {
    output.textContent = `FAIL: ${error.message}`;
    throw error;
  }
})();
</script>
