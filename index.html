<!doctype html>
<html lang="zh-Hant"><head>

<style>
:root{--ink:#18352a;--green:#2f624a;--green-deep:#1f4937;--sage:#dce7dc;--mist:#f3f6f1;--paper:#fffefa;--muted:#68746d;--line:#dbe1d9;--soft:#edf1eb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:transparent;border:0}#app{min-height:100vh;padding-bottom:calc(66px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:3;background:rgba(255,254,250,.97);border-bottom:1px solid var(--line);padding:15px 18px 12px}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand h1{font-size:20px;letter-spacing:.06em;margin:0;color:var(--green-deep)}.brand-tools{display:flex;align-items:center;gap:12px}.brand-note,.header-settings{font-size:11px;letter-spacing:.13em;color:var(--green);font-weight:800;white-space:nowrap}.header-settings{padding:3px 0}.page{padding:22px 18px;max-width:620px;margin:auto}.eyebrow{font-size:11px;color:var(--green);letter-spacing:.12em;text-transform:uppercase;margin:0 0 5px;font-weight:700}.title{font-size:30px;margin:0 0 15px;letter-spacing:.01em;line-height:1.25}.sub,.meta,.tiny{color:var(--muted)}.sub{font-size:14px;margin:4px 0 14px}.tiny{font-size:12px}.primary,.secondary,.ghost{padding:10px 13px;border-radius:4px;font-weight:700;font-size:15px}.primary{background:var(--green-deep);color:#fff}.secondary{border:1px solid var(--green);color:var(--green-deep);background:transparent}.ghost{padding:7px 3px;color:var(--green);font-weight:700}.danger{color:#8a3530;border-color:#8a3530}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.card{padding:15px 0;margin:10px 0;border-bottom:1px solid var(--line);background:transparent}.card.active{border-top:1px solid var(--line)}.card h3{font-size:18px;margin:0 0 3px}.progress{height:6px;background:var(--soft);margin:9px 0 5px}.progress span{display:block;height:100%;background:var(--green)}.list{border-top:1px solid var(--line)}.item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}.item input{width:22px;height:22px;margin-top:2px;accent-color:var(--green-deep);flex:none}.item.checked .item-name{text-decoration:line-through;color:var(--muted)}.item-name{font-weight:700;color:var(--ink)}.reason{font-size:12px;color:var(--muted);margin-top:2px;display:block}.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 3px}.section-head h2{font-size:18px;margin:0;color:var(--green-deep)}.section-head span{font-size:14px;color:var(--green);font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,254,250,.98);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:5;padding-bottom:env(safe-area-inset-bottom)}.nav button{padding:14px 4px 12px;color:var(--muted);font-size:15px}.nav button.active{color:var(--green-deep);font-weight:800;box-shadow:inset 0 3px 0 var(--green)}.split{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}.split button{padding:11px 4px;color:var(--muted)}.split button.active{color:var(--green-deep);box-shadow:inset 0 -3px 0 var(--green);font-weight:800}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field label{font-size:13px;font-weight:700;color:var(--green-deep)}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:3px;padding:10px;background:var(--paper);width:100%;outline-color:var(--green)}.field textarea{min-height:82px;resize:vertical}.full{grid-column:1/-1}.checks{display:flex;flex-wrap:wrap;gap:6px}.check-label{border:1px solid var(--line);padding:6px 8px;font-size:13px;display:flex;gap:5px;align-items:center;border-radius:3px}.check-label:has(input:checked){border-color:var(--green);background:var(--mist)}.check-label input{width:auto}.dialog{position:fixed;inset:0;background:rgba(24,53,42,.30);z-index:9;padding:15px;display:flex;align-items:flex-end}.dialog-box{background:var(--paper);width:100%;max-width:620px;margin:auto;max-height:88vh;overflow:auto;padding:19px;border-top:3px solid var(--green-deep);border-radius:8px 8px 0 0}.dialog-box h2{font-size:22px;margin:0 0 8px;color:var(--green-deep)}.hidden{display:none!important}.empty{text-align:center;padding:48px 10px;color:var(--muted)}.art{font-size:42px;margin:5px 0 14px;display:block}.sync-light{width:11px;height:11px;border-radius:50%;background:#9aa39d;box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--line)}.sync-light.online{background:#2f8a62}.sync-light.syncing{background:#d69a32;animation:pulse 1.1s ease-in-out infinite}.sync-light.offline{background:#9aa39d}@keyframes pulse{50%{opacity:.35}}.sync-tip{position:fixed;z-index:20;right:10px;top:58px;max-width:220px;padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--paper);box-shadow:0 4px 14px #18352a22;font-size:12px}.gear-row{display:flex;align-items:center;border-bottom:1px solid var(--line)}.gear-row .open{flex:1;display:flex;gap:10px;padding:14px 0;text-align:left}.tag{border:1px solid var(--line);padding:3px 6px;font-size:12px;color:var(--green);border-radius:2px;white-space:nowrap}.remove{font-size:26px;line-height:1;padding:7px;color:var(--green)}.settings-section{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}@media(max-width:380px){.title{font-size:27px}.brand-note{font-size:9px}.brand-tools{gap:8px}.page{padding-left:14px;padding-right:14px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
