<!doctype html>
<html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1f4937"><link rel="manifest" href="manifest.webmanifest"><title>露營助手</title>
  <style>
    :root{--ink:#18352a;--green:#1f4937;--line:#dbe1d9;--paper:#fffefa;--muted:#68746d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif}main{max-width:680px;margin:auto;padding:24px 20px calc(38px + env(safe-area-inset-bottom))}header{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}h1,h2,p{margin-top:0}h1{font-size:28px}h2{font-size:18px}.sub,.meta,small{color:var(--muted)}.hidden{display:none!important}.auth{display:grid;gap:12px;max-width:400px}.auth label{display:grid;gap:4px;font-weight:700}.auth input{padding:11px;border:1px solid var(--line);border-radius:4px;font:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap}button{appearance:none;border:1px solid var(--green);border-radius:4px;padding:10px 13px;background:transparent;color:var(--green);font:700 15px inherit}.primary{background:var(--green);color:white}.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);margin-bottom:16px}.tabs button{border:0;border-radius:0;padding:10px 4px;color:var(--muted)}.tabs .active{color:var(--green);box-shadow:inset 0 -3px var(--green)}.section{margin:18px 0}.section-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:7px}.count{color:var(--green);font-weight:700}.item{display:flex;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);font-weight:650}.item input{width:23px;height:23px;accent-color:var(--green);flex:none}.item.checked span{text-decoration:line-through;color:var(--muted)}.item small{margin-left:auto;font-weight:400}.trip{display:grid;gap:3px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 2px;color:var(--ink)}.trip.current{box-shadow:inset 3px 0 var(--green);padding-left:10px}.trip span{font-size:14px;color:var(--muted)}.trip-summary{padding:6px 0}.empty{padding:48px 5px;text-align:center;color:var(--muted)}#status{min-height:1.5em;color:var(--muted);font-size:14px}
  </style></head><body><main>
  <header><p class="sub">露營助手 · 跨裝置同步</p><h1>我的露營</h1><p id="status" aria-live="polite"></p></header>
  <section id="auth" class="auth"><h2>登入同步帳號</h2><p class="meta">以同一組帳號登入電腦與手機。沒網路時仍可操作，重新連線後會自動同步。</p><label>Email<input id="email" type="email" autocomplete="email"></label><label>密碼<input id="password" type="password" minlength="8" autocomplete="current-password"></label><div class="actions"><button id="login" class="primary">登入</button><button id="signup">首次建立帳號</button></div></section>
  <section id="app" class="hidden"><div class="actions"><button id="sync-now">立即同步</button><button id="logout">登出</button></div><nav id="tabs" class="tabs"></nav><div id="content"></div></section>
  </main><script src="sync-config.js"></script><script src="sync-engine.js"></script><script src="app.js"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});</script></body></html>
