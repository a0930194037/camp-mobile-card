<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>更新露營助手</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffefa;color:#18352a;font:16px system-ui,"Microsoft JhengHei",sans-serif}.box{text-align:center;max-width:300px;padding:28px}.dot{width:12px;height:12px;margin:0 auto 18px;border-radius:50%;background:#2f8a62;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.3}}</style>
<main class="box"><div class="dot"></div><strong>正在更新露營助手…</strong><p>完成後會自動回到「我的行程」。</p></main>
<script>
  (async () => {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration => registration.unregister()));
    }
    if ('caches' in window) {
      const names = await caches.keys();
      await Promise.all(names.map(name => caches.delete(name)));
    }
    location.replace('./?v=20');
  })().catch(() => location.replace('./?v=20'));
</script>
</html>
